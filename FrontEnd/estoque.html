<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Estoque | Prazo Certo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="estoque.css">
    <link rel="stylesheet" href="fonte.css">
    <link rel="stylesheet" href="navegacao.css">
</head>

<body>
    <aside class="sidebar">
        <h1>PrazoCerto</h1>
        <nav><a href="dashboard.html"><i class="bi bi-house-fill"></i>Dashboard</a><a href="calendario.html"><i
                    class="bi bi-calendar3"></i>Calendário</a><a class="ativo" href="estoque.html"><i
                    class="bi bi-box-seam"></i>Estoque</a><a href="PctPromocionais.html"><i
                    class="bi bi-boxes"></i>Pacotes promocionais</a><a href="config.html"><i
                    class="bi bi-gear"></i>Configurações</a></nav>
        <div class="usuario"><i class="bi bi-person-circle"></i><span>Usuário</span><i class="bi bi-chevron-down"></i></div>
    </aside>
    <main>
        <div class="topo-estoque"><label class="busca"><i class="bi bi-search"></i><input id="busca"
                    placeholder="Pesquise no estoque"></label><a class="btn-cadastrar" href="cadastrarProdutos.html">
                Cadastrar produto</a><a class="btn-cadastrar" href="validarSaida.html">Registrar saída</a></div><select id="filtro">
            <option value="proximo">Validade mais próxima</option>
            <option value="distante">Validade mais distante</option>
        </select>
        <section id="lista" class="lista"></section>
    </main>
    <div id="janelaEdicao" class="janela-edicao">
        <form id="formEdicao" class="form-edicao">
            <h2>Alterar produto</h2><input id="editarId" type="hidden">
            <label>Nome<input id="editarNome" required></label>
            <label>Quantidade<input id="editarQuantidade" type="number" min="1" required></label>
            <label>Validade<input id="editarValidade" type="date" required></label>
            <div><button id="cancelarEdicao" class="cancelar-edicao" type="button">Cancelar</button><button class="salvar-edicao" type="submit">Salvar</button></div>
        </form>
    </div>
    <script src="api.js"></script>
    <script src="estoque.js"></script>
</body>

</html>
