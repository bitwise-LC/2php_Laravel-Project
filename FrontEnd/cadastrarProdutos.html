<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto | Prazo Certo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="cadastrarProdutos.css">
    <link rel="stylesheet" href="fonte.css">
    <link rel="stylesheet" href="navegacao.css">
</head>

<body>
    <aside class="sidebar">
        <h1>PrazoCerto</h1>
        <nav><a href="dashboard.html"><i class="bi bi-house-fill"></i>Dashboard</a><a href="calendario.html"><i
                    class="bi bi-calendar3"></i>Calendário</a><a class="ativo" href="estoque.html"><i
                    class="bi bi-box-seam"></i>Estoque</a><a href="PctPromocionais.html"><i
                    class="bi bi-boxes"></i>Pacotes promocionais</a><a href="config.html"><i
                    class="bi bi-gear"></i>Configurações</a></nav>
        <div class="usuario"><i class="bi bi-person-circle"></i><span>Usuário</span><i class="bi bi-chevron-down"></i></div>
    </aside>
    <main>
        <header class="topo">
            <div>
                <h1>Cadastrar produto</h1>
            </div>
        </header>
        <section class="conteudo" aria-labelledby="titulo-formulario">
            <div class="intro">
                <div>
                    <h2 id="titulo-formulario">Novo item no estoque</h2>
                    <p>Informe os dados do produto para adicioná-lo ao estoque.</p>
                </div>
            </div>
            <form id="formProduto" novalidate>
                <div class="formulario">
                    <div class="campos">
                        <div class="campo">
                            <label for="nomeProduto">Nome do produto <b>*</b></label>
                            <div class="input-com-icone"><input id="nomeProduto" name="nome" type="text"
                                    placeholder="Ex.: Iogurte natural" maxlength="80" required autocomplete="off"></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="codigoProduto">Código do produto <b>*</b></label>
                            <div class="input-com-icone"><input id="codigoProduto" type="text" maxlength="60" placeholder="Ex.: IOG-001" required></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="descricaoProduto">Descrição</label>
                            <div class="input-com-icone"><input id="descricaoProduto" type="text" maxlength="255" placeholder="Detalhes opcionais"></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="dataFabricacao">Data de fabricação <b>*</b></label>
                            <div class="input-com-icone"><input id="dataFabricacao" type="date" required></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="validadeProduto">Data de validade <b>*</b></label>
                            <div class="input-com-icone"><input id="validadeProduto" name="validade" type="date"
                                    required></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="valorProduto">Valor do produto <b>*</b></label>
                            <div class="input-com-icone"><input id="valorProduto" name="valor" type="number" min="0.01"
                                    step="0.01" placeholder="Ex.: 5,50" required></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="categoriaProduto">Categoria do produto <b>*</b></label>
                            <div class="input-com-icone"><select id="categoriaProduto" required><option value="">Carregando categorias...</option></select></div>
                            <small class="erro"></small>
                        </div>
                        <div class="campo">
                            <label for="quantidadeProduto">Quantidade do produto <b>*</b></label>
                            <div class="input-com-icone"><input id="quantidadeProduto" type="number" min="1" step="1" placeholder="Ex.: 10" required></div>
                            <small class="erro"></small>
                        </div>
                    </div>
                </div>
                <div class="acoes"><a class="btn-cancelar" href="estoque.html">Cancelar</a><button class="btn-salvar"
                        type="submit"> Cadastrar produto</button></div>
            </form>
        </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"><i class="bi bi-check-circle-fill"></i><span>Produto
            cadastrado com sucesso!</span></div>
    <script src="api.js"></script>
    <script src="cadastrarProdutos.js"></script>
</body>

</html>
