<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar saída | Prazo Certo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="cadastrarProdutos.css">
    <link rel="stylesheet" href="validarSaida.css">
    <link rel="stylesheet" href="navegacao.css">
</head>

<body>
    <aside class="sidebar">
        <h1>PrazoCerto</h1>
        <nav><a href="dashboard.html"><i class="bi bi-house-fill"></i>Dashboard</a><a href="calendario.html"><i
                    class="bi bi-calendar3"></i>Calendário</a><a class="ativo" href="estoque.html"><i
                    class="bi bi-box-seam"></i>Estoque</a><a href="PctPromocionais.html"><i
                    class="bi bi-boxes"></i>Pacotes promocionais</a><a href="config.html"><i
                    class="bi bi-gear"></i>Configurações</a></nav>
        <div class="usuario"><i class="bi bi-person-circle"></i><span>Usuário</span><i class="bi bi-chevron-down"></i></div>
    </aside>
    <main>
        <header class="topo">
            <div>
                <h1>Validar saída</h1>
            </div>
        </header>
        <section class="conteudo">
            <div class="intro">
                <div>
                    <h2>Saída de produto</h2>
                    <p>Informe se o produto saiu dentro do prazo de validade.</p>
                </div>
            </div>
            <form id="formSaida">
                <div class="formulario">
                    <div class="campos">
                        <div class="campo"><label for="produtoSaida">Produto <b>*</b></label>
                            <div class="input-com-icone"><select id="produtoSaida" required>
                                    <option value="">Selecione um produto</option>
                                </select></div><small class="erro"></small>
                        </div>
                        <div class="campo"><label>O produto saiu na validade? <b>*</b></label>
                            <div class="opcoes-validade"><label><input type="radio" name="validade" value="salvo"
                                        required> Sim, saiu na validade</label><label><input type="radio"
                                        name="validade" value="perdido"> Não, foi perdido</label></div><small
                                class="erro"></small>
                        </div>
                        <div class="campo"><label for="quantidadeSaida">Quantidade <b>*</b></label>
                            <div class="input-com-icone"><input id="quantidadeSaida" type="number" min="1" value="1" required></div><small class="erro"></small>
                        </div>
                    </div>
                    <p id="infoProduto" class="info-produto"></p>
                </div>
                <div class="acoes"><a class="btn-cancelar" href="estoque.html">Cancelar</a><button class="btn-salvar"
                        type="submit"> Validar saída</button></div>
            </form>
        </section>
    </main>
    <div class="toast" id="toast"><i class="bi bi-check-circle-fill"></i><span>Saída registrada com sucesso!</span>
    </div>
    <script src="api.js"></script>
    <script src="validarSaida.js"></script>
</body>

</html>
